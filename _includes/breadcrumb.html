{%- if page.url != "/" -%}
<nav class="breadcrumb" aria-label="パンくずリスト">
  <ol>
    <li><a href="{{ '/' | relative_url }}">ホーム</a></li>
    {%- if page.layout == "post" -%}
      {%- include post-cat.html -%}
      {%- if post_cat %}
    <li><a href="{{ post_cat.slug | prepend: '/' | append: '/' | relative_url }}">{{ post_cat.name }}</a></li>
      {%- endif %}
    {%- endif %}
    <li aria-current="page">{{ page.heading | default: page.title }}</li>
  </ol>
</nav>
{%- endif -%}
