{%- assign about_url = '/about/' | absolute_url -%}
{%- assign home_url = '/' | absolute_url -%}
{%- if page.url == "/" -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": {{ site.title | jsonify }},
  "alternateName": "gtshin.com",
  "url": "{{ home_url }}",
  "description": {{ site.description | jsonify }},
  "inLanguage": "ja",
  "publisher": {
    "@type": "Person",
    "name": {{ site.author.name | jsonify }},
    "url": "{{ about_url }}"
  }
}
</script>
{%- elsif page.layout == "post" -%}
{%- include post-cat.html -%}
{%- assign sd_cat = post_cat -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Article",
      "headline": {{ page.title | jsonify }},
      "description": {{ page_desc | jsonify }},
      "image": ["{{ page_image }}"],
      "datePublished": "{{ page.date | date_to_xmlschema }}",
      "dateModified": "{{ page.last_modified_at | default: page.date | date_to_xmlschema }}",
      "inLanguage": "ja",
      "mainEntityOfPage": "{{ canonical }}",
      "author": {
        "@type": "Person",
        "name": {{ site.author.name | jsonify }},
        "url": "{{ about_url }}"
      },
      "publisher": {
        "@type": "Person",
        "name": {{ site.author.name | jsonify }},
        "url": "{{ about_url }}"
      }
    },
    {
      "@type": "BreadcrumbList",
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "ホーム", "item": "{{ home_url }}" }
        {%- if sd_cat -%},
        { "@type": "ListItem", "position": 2, "name": {{ sd_cat.name | jsonify }}, "item": "{{ sd_cat.slug | prepend: '/' | append: '/' | absolute_url }}" },
        { "@type": "ListItem", "position": 3, "name": {{ page.title | jsonify }}, "item": "{{ canonical }}" }
        {%- else -%},
        { "@type": "ListItem", "position": 2, "name": {{ page.title | jsonify }}, "item": "{{ canonical }}" }
        {%- endif %}
      ]
    }
  ]
}
</script>
{%- else -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    { "@type": "ListItem", "position": 1, "name": "ホーム", "item": "{{ home_url }}" },
    { "@type": "ListItem", "position": 2, "name": {{ page.heading | default: page.title | jsonify }}, "item": "{{ canonical }}" }
  ]
}
</script>
{%- endif -%}
