{%- assign p = include.post -%}
<li class="post-item">
  <a href="{{ p.url | relative_url }}">
    <span class="post-item-title">{{ p.title }}</span>
    {%- if p.description and include.show_desc %}
    <span class="post-item-desc">{{ p.description | strip_html | truncate: 70 }}</span>
    {%- endif %}
    <span class="post-item-meta">
      {%- if include.show_cat and p.category %}<span class="post-item-cat">{{ p.category }}</span>{% endif -%}
      <time datetime="{{ p.date | date_to_xmlschema }}">{{ p.date | date: "%Y年%-m月%-d日" }}</time>
    </span>
  </a>
</li>
