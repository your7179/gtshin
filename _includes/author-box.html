<aside class="author-box" aria-label="この記事を書いた人">
  <p class="author-box-label">この記事を書いた人</p>
  <div class="author-box-inner">
    <img class="author-avatar" src="{{ '/assets/images/author.jpg' | relative_url }}" alt="{{ site.author.short_name }}" width="72" height="72">
    <div>
      <p class="author-name">{{ site.author.name }}</p>
      <p class="author-bio">{{ site.author.bio }}</p>
      <p class="author-link"><a href="{{ '/about/' | relative_url }}">運営者情報を見る</a>{% if site.author.x %}<span class="link-sep">｜</span><a href="https://x.com/{{ site.author.x }}" target="_blank" rel="noopener me">X（@{{ site.author.x }}）</a>{% endif %}</p>
    </div>
  </div>
</aside>
