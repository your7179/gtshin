{%- assign p = include.post -%}
<li class="card" data-sub="{{ p.subcategory }}">
  <a href="{{ p.url | relative_url }}">
    <p class="card-meta"><time datetime="{{ p.date | date_to_xmlschema }}">{{ p.date | date: "%Y.%m.%d" }}</time>{% if p.subcategory %} · {{ p.subcategory }}{% endif %}</p>
    <h2 class="card-title">{{ p.title }}</h2>
    {%- if p.description %}
    <p class="card-desc">{{ p.description | strip_html }}</p>
    {%- endif %}
  </a>
</li>
