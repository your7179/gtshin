---
layout: default
---
{% include breadcrumb.html %}
<article class="article page">
  <header class="article-header">
    <h1 class="article-title">{{ page.heading | default: page.title }}</h1>
    {%- if page.updated %}
    <p class="article-meta"><span>最終更新日：{{ page.updated | date: "%Y年%-m月%-d日" }}</span></p>
    {%- endif %}
  </header>
  <div class="article-body">
{{ content }}
  </div>
</article>
